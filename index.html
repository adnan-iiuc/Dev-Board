<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevBoard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DevBoard</h1>
    </header>

    <main>
      <div id="top-section">
        <section class="task-summary">
            <h2>Task Assigned</h2>
            <p id="task-count">6</p>
        </section>

        <section class="daily-discovery">
            <h2>Discover Something New Today</h2>
            <p id="current-date">Date</p>
        </section>
      </div>
        <section class="tasks">

            <h2>Tasks</h2>

            <div class="task-list">

                <div class="task-card">
                    <h3>Fix Mobile Button Issue</h3>
                    <p>Programming Hero</p>
                    <button>Completed</button>
                </div>

                <div class="task-card">
                    <h3>Add Pay Success Modal</h3>
                    <p>Programming Hero</p>
                    <button>Completed</button>
                </div>

                <div class="task-card">
                    <h3>Add New Reaction</h3>
                    <p>Programming Hero</p>
                    <button>Completed</button>
                </div>

            </div>

        </section>

        <section class="activity-log">

            <h2>Activity Log</h2>

            <div class="activity">
                <p>Programming Hero</p>
                <p>Fix Mobile Button Issue</p>
                <span>Completed</span>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
